<!DOCTYPE html>
<html lang="zh-CN" data-app-id="shh17-service-center">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务中心</title>
<!--
  全部资源用**相对路径**引用，并带 ?v= 版本参数：
    · 相对路径 —— 应用会被平台挂在 /<appid>/ 或 /v2/proxy/<appid>/ 下，
      写死绝对路径会导致白屏（审核项 F7）。
    · ?v= 版本参数 —— 升级后不会读到旧缓存（指引 8.8）。
-->
<link rel="stylesheet" href="./app.css?v=1.0.0">
<style>
  /* 本应用的品牌色（设计系统用 --app-accent 一个变量区分应用） */
  :root { --app-accent: #0E8C7F; --app-accent-weak: #e4f4f2; }
  @media (prefers-color-scheme: dark) { :root { --app-accent-weak: #12312e; } }

  .toolbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .toolbar .grow { flex: 1; }
  .toolbar input[type="search"], .toolbar input[type="text"] {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 6px 10px; color: var(--text);
    font-size: 13px; min-width: 180px;
  }
  /* 只绑回环地址的服务：地址拼得出来，但从浏览器打不开 */
  .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle; background: var(--text-faint);
  }
  .dot.up    { background: var(--ok); }
  .dot.local { background: var(--warn); }
  .dot.off   { background: var(--text-faint); }
  .svc { font-weight: 600; }
  .svc .sub { font-weight: 400; color: var(--text-faint); font-size: 12px; }
  .hint-inline { color: var(--text-faint); font-size: 12px; }
  .kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr;
        gap: 4px 14px; font-size: 13px; }
  .kv dt { color: var(--text-soft); }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; word-break: break-all; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 4px 6px 4px 10px; font-size: 12.5px;
    font-family: var(--mono); max-width: 100%;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button {
    border: 0; background: none; cursor: pointer; color: var(--text-faint);
    padding: 0 2px; line-height: 1;
  }
  .chip button:hover { color: var(--danger); }
</style>
</head>
<body>
<div class="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 512 512" width="22" height="22" aria-hidden="true">
        <rect x="32" y="32" width="448" height="448" rx="104" fill="#0E8C7F"/>
        <text x="256" y="268" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif"
              font-size="104" font-weight="700" text-anchor="middle"
              dominant-baseline="central" letter-spacing="2">SVC</text>
      </svg>
      <span class="name">服务中心</span>
    </div>
    <span class="meta" id="source-meta"></span>
    <span class="spacer"></span>
    <span class="meta" id="app-version"></span>
  </header>

  <!-- 左侧导航 -->
  <nav class="nav" id="nav"></nav>

  <!-- 核心工作区 -->
  <main class="main" id="main"></main>

  <!-- 底部任务栏 -->
  <div class="taskbar" id="taskbar"></div>
</div>

<div id="toasts" class="toasts"></div>

<script src="./icons.js?v=1.0.0"></script>
<script src="./app.js?v=1.0.0"></script>
<script src="./service.js?v=1.0.0"></script>
</body>
</html>
